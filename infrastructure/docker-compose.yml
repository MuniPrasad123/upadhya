name: upadhya

services:
  upadhya-postgres:
    container_name: upadhya-postgres
    image: postgres:17
    restart: unless-stopped
    ports:
      - "${UPADHYA_POSTGRES_HOST_PORT:-55433}:5432"
    environment:
      POSTGRES_DB: ${UPADHYA_POSTGRES_DB:-upadhya_db}
      POSTGRES_USER: ${UPADHYA_POSTGRES_USER:-upadhya_user}
      POSTGRES_PASSWORD: ${UPADHYA_POSTGRES_PASSWORD:?Set UPADHYA_POSTGRES_PASSWORD in .env}
    volumes:
      - upadhya-postgres-data:/var/lib/postgresql/data
    networks:
      - upadhya-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      com.upadhya.project: "upadhya"
      com.upadhya.component: "postgresql"

  upadhya-qdrant:
    container_name: upadhya-qdrant
    image: qdrant/qdrant:v1.15.0
    restart: unless-stopped
    ports:
      - "${UPADHYA_QDRANT_HTTP_PORT:-6433}:6333"
      - "${UPADHYA_QDRANT_GRPC_PORT:-6434}:6334"
    volumes:
      - upadhya-qdrant-data:/qdrant/storage
    networks:
      - upadhya-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      com.upadhya.project: "upadhya"
      com.upadhya.component: "qdrant"

networks:
  upadhya-network:
    name: upadhya-network
    driver: bridge
    labels:
      com.upadhya.project: "upadhya"

volumes:
  upadhya-postgres-data:
    name: upadhya-postgres-data
    labels:
      com.upadhya.project: "upadhya"
  upadhya-qdrant-data:
    name: upadhya-qdrant-data
    labels:
      com.upadhya.project: "upadhya"
